<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bandylive GitHub-only -testi</title><script src="github-only.js"></script><style>body{font:16px system-ui;background:#111a20;color:#fff;max-width:900px;margin:30px auto;padding:0 16px}button{padding:10px;margin:4px;background:#e8c547;border:0;font-weight:bold;cursor:pointer}pre{white-space:pre-wrap;background:#202d36;padding:12px;border-radius:6px}.ok{color:#79e6a4}.bad{color:#ff9b9b}</style></head><body><h1>Bandylive – GitHub-only yhteystesti</h1><p>Tämä testi tekee oikeat selaimen fetch-pyynnöt. Jos TorneoPal estää CORSin, selain näyttää virheen.</p><label>Ottelu ID <input id="match" value="23611"></label> <label>Turnaus <input id="tournament" value="sjpl_2526"></label> <label>Sarja <input id="series" value="MBL"></label><p><button id="testLive">Testaa live-rajapinta</button><button id="testMatch">Testaa ottelusivu</button><button id="testStandings">Testaa sarjataulukko</button><button id="testLocal">Testaa paikallinen tallennus</button></p><pre id="out">Valitse testi.</pre><script>const $=id=>document.getElementById(id),out=$('out');async function test(label,url){out.textContent=label+'…';try{const r=await fetch(url,{cache:'no-store'});const t=await r.text();out.textContent=label+'\nHTTP '+r.status+'\nSisältötyyppi: '+(r.headers.get('content-type')||'?')+'\nPituus: '+t.length+'\n\n'+t.slice(0,900);out.className=r.ok?'ok':'bad'}catch(e){out.className='bad';out.textContent=label+'\nEPÄONNISTUI: '+e.name+': '+e.message+'\n\nJos konsolissa näkyy CORS-virhe, sitä ei voi kiertää GitHub Pagesin JavaScriptillä.'}}$('testLive').onclick=()=>{const u=new URL('/api/live',location.href);u.searchParams.set('pvm',new Date().toISOString().slice(0,10));u.searchParams.set('turnaus',$('tournament').value);test('Live',u)};$('testMatch').onclick=()=>{const u=new URL('/api/match',location.href);u.searchParams.set('ottelu',$('match').value);test('Ottelusivu',u)};$('testStandings').onclick=()=>{const u=new URL('/api/standings',location.href);u.searchParams.set('turnaus',$('tournament').value);u.searchParams.set('sarja',$('series').value);test('Sarjataulukko',u)};$('testLocal').onclick=async()=>{try{const r=await fetch('/api/default-match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ottelu:$('match').value,pvm:'',turnaus:$('tournament').value})});const a=await r.json();const b=await(await fetch('/api/default-match')).json();out.className='ok';out.textContent='Tallennus HTTP '+r.status+'\nTallennettu: '+JSON.stringify(a,null,2)+'\nLuettu takaisin: '+JSON.stringify(b,null,2)}catch(e){out.className='bad';out.textContent=e.message}}</script></body></html>
